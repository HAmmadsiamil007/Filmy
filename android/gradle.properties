# JVM args for the Gradle daemon. Android builds are memory hungry.
org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8

# Use AndroidX (Jetpack) packages rather than the legacy support library.
android.useAndroidX=true

# Only expose the R class of the module that defines a resource, not every
# transitive module. Faster builds, catches leaked resources.
android.nonTransitiveRClass=true

# Opt in to Kotlin's opt-in annotations cleanly across modules.
kotlin.code.style=official
